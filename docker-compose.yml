services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cablera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cablera}
      POSTGRES_DB: ${POSTGRES_DB:-cablera}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
