server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # OJO: un add_header dentro de un `location` anula los del `server` (nginx no los combina),
    # por eso el caché se define con `expires` y las cabeceras de seguridad quedan arriba.

    # Archivos con hash en el nombre: se pueden cachear por mucho tiempo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta del router vuelve a index.html.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
